<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBot AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">🍴</span>
            <div>
                <h1>FoodBot AI</h1>
                <p>Tell me what's in your kitchen. I'll suggest what to cook.</p>
            </div>
        </div>
        <button type="button" id="clearBtn" class="ghost-btn" title="Start a new chat">New chat</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
        <div class="msg bot welcome">
            <p>👋 Hi! I'm <b>FoodBot AI</b>.</p>
            <p>Type the ingredients you have or the kind of food you want, choose a diet, and press <b>Recommend</b>.</p>
            <p class="hint">Try one of these:</p>
            <div class="chips">
                <button type="button" class="chip" data-text="rice, paneer, vegetables">🧀 Rice, paneer, vegetables</button>
                <button type="button" class="chip" data-text="chicken, rice, onion">🍗 Chicken, rice, onion</button>
                <button type="button" class="chip" data-text="egg, onion, tomato">🥚 Egg, onion, tomato</button>
                <button type="button" class="chip" data-text="pasta, cheese">🍝 Pasta, cheese</button>
                <button type="button" class="chip" data-text="light healthy salad">🥗 Healthy salad</button>
                <button type="button" class="chip" data-text="South Indian breakfast">🥞 South Indian breakfast</button>
            </div>
        </div>
    </main>

    <footer class="composer">
        <div class="diet-toggle" role="radiogroup" aria-label="Diet preference">
            <label><input type="radio" name="diet" value="Any" checked><span>Any</span></label>
            <label><input type="radio" name="diet" value="Vegetarian"><span>🟢 Veg</span></label>
            <label><input type="radio" name="diet" value="Non-Vegetarian"><span>🔴 Non-Veg</span></label>
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="e.g. rice, paneer, vegetables" autocomplete="off" aria-label="Ingredients or food preference">
            <button type="button" id="sendBtn" class="send-btn">Recommend</button>
        </div>
    </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
