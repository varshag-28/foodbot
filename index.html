<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🍽️ Food Menu Bot</title>
    <style>
        body {
            background-color: #fffaf0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: #71b5f5;
            color: white;
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #chatbox {
            width: 380px;
            height: 450px;
            overflow-y: auto;
            margin: 30px 0 15px;
            background-color: #fff8ec;
            border: 2px solid #5885da;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.08);
        }

        .message {
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 75%;
            clear: both;
            word-wrap: break-word;
        }

        .user {
            background-color: #ffe0c3;
            color: #333;
            float: right;
            text-align: right;
        }

        .bot {
            background-color: #ffeedb;
            color: #444;
            float: left;
            text-align: left;
        }

        #inputArea {
            width: 380px;
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        #userInput {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            padding: 10px 16px;
            font-size: 15px;
            background-color: #4c86b6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3d9dca;
        }

        footer {
            font-size: 13px;
            color: #777;
            margin-top: auto;
            padding-bottom: 15px;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>
    <header>🍔 Food Menu Chatbot</header>

    <div id="chatbox">
        <div class="message bot clearfix">👋 Hello! I'm your food assistant. Ask me what to eat today!</div>
    </div>

    <div id="inputArea">
        <input type="text" id="userInput" placeholder="Type something..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <footer>Made with ❤️ for food lovers</footer>

    <script>
        function sendMessage() {
            const userInput = document.getElementById("userInput").value.trim();
            if (!userInput) return;

            const chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class="message user clearfix">🍽️ You: ${userInput}</div>`;

            fetch(`/get?msg=${encodeURIComponent(userInput)}`)
                .then(response => response.json())
                .then(data => {
                    chatbox.innerHTML += `<div class="message bot clearfix">🤖 Bot: ${data}</div>`;
                    chatbox.scrollTop = chatbox.scrollHeight;
                });

            document.getElementById("userInput").value = "";
        }
    </script>
</body>
</html>
